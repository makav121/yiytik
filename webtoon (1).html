function add(parent,key,anchor){if(!parent||!key||!anchor)return;const current=parent.querySelector(':scope > .yj-story-art');if(current?.dataset.scene===key)return;if(current)current.remove();const fig=document.createElement('figure');fig.className='yj-story-art';fig.dataset.scene=key;fig.innerHTML=illustrations[key]+'<figcaption>'+captions[key]+'</figcaption>';anchor.insertAdjacentElement('afterend',fig);}
function decorate(){const start=document.querySelector('#app .s2-start-card');if(start)add(start,'opening',start.querySelector('h1'));const game=document.querySelector('#season2Simulation .s2-game');if(!game)return;const h=game.querySelector('h1');const txt=h?.textContent||'';const label=game.querySelector('.s2-label');let key=null, anchor=h||label;
if(game.querySelector('.s2-sms')){key='sms';anchor=label;}
else if(game.querySelector('.s2-home-banner')||txt.includes('10만 원으로')){key='temptation';anchor=game.querySelector('.s2-home-banner')||h;}
else if(txt.includes('잔액을 모두 잃었습니다'))key='loss';
else if(txt.includes('50만 원도 모두'))key='borrow';
else if(txt.includes('남은 것은 빚'))key='police';
else if(txt.includes('예방 메시지')||txt.includes('나 같은 친구'))key='recovery';
// Do not insert illustrations during active card rounds: preserve existing interactions.
if(key)add(game,key,anchor);else game.querySelector(':scope > .yj-story-art')?.remove();}

.yj-judgment{margin:16px 0;padding:15px;border:1px solid #78869b;border-radius:12px;background:#172234;color:#f5f7fa;text-align:left;line-height:1.6}.yj-judgment h3{font-size:16px;margin:0 0 8px;color:#fff}.yj-judgment p{margin:5px 0 10px;font-size:14px}.yj-judgment button{display:block;width:100%;white-space:normal;text-align:left;padding:12px;margin:8px 0;border:1px solid #758396;border-radius:8px;background:#27384d;color:#fff;cursor:pointer}.yj-judgment button:disabled{opacity:.55;cursor:default}.yj-judgment button.yj-correct{opacity:1;background:#1a4b39;border-color:#8ce6ac}.yj-judgment button.yj-wrong{opacity:1;background:#59422b;border-color:#e8b26b}.yj-feedback{padding:12px;border-radius:8px;margin-top:12px;background:#263345}.yj-feedback.good{background:#15392d;color:#d9fbe7}.yj-stamp{display:inline-block;border:3px double #94e8b7;color:#94e8b7;padding:7px 12px;border-radius:7px;font-size:24px;line-height:1.25;font-weight:900;transform:rotate(-5deg);animation:yj-pop .35s ease-out;margin:3px 0 10px}.yj-feedback strong{display:block;font-size:17px}.yj-feedback p{margin-bottom:0}@keyframes yj-pop{from{opacity:0;transform:scale(1.65) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){.yj-stamp{animation:none}}
</style><script id="yj-judgment-script">
(()=>{
const questions={sms:{q:'친구가 돈을 쉽게 벌 수 있다며 링크를 보냈습니다. 어떻게 해야 할까요?',options:['친구가 보낸 링크니까 바로 접속한다.','링크를 열지 않고 믿을 수 있는 어른에게 알린다.'],correct:1,good:'수상한 링크는 열지 않고 메시지를 보존하는 것이 안전합니다.',bad:'친구가 보낸 링크라도 안전하다는 보장은 없습니다.'},loss:{q:'이미 잃은 돈이 있습니다. 어떤 선택이 안전할까요?',options:['즉시 멈추고 도움을 요청한다.','잃은 돈을 찾기 위해 더 충전한다.'],correct:0,good:'손실을 되찾으려 반복하지 않는 것이 중요합니다.',bad:'손실을 만회하려는 행동은 피해를 더 크게 만들 수 있습니다.'},police:{q:'민우가 도움을 요청하기로 했습니다. 무엇을 해야 할까요?',options:['메시지와 송금 기록을 모두 삭제한다.','관련 기록을 보존하고 상담과 도움을 요청한다.'],correct:1,good:'기록을 보존하고 도움을 요청하는 것은 중요한 첫걸음입니다.',bad:'기록을 삭제하기보다는 보존하고 도움을 요청하세요.'}};
function mountQuiz(){const g=document.querySelector('#season2Simulation .s2-game');if(!g)return;const h=g.querySelector('h1')?.textContent||'';const key=g.querySelector('.s2-sms')?'sms':h.includes('잔액을 모두 잃었습니다')?'loss':h.includes('남은 것은 빚')?'police':null;if(!key||g.querySelector('.yj-judgment'))return;const q=questions[key];const box=document.createElement('section');box.className='yj-judgment';box.setAttribute('aria-label','수사대 판단 미션');const title=document.createElement('h3');title.textContent='🔎 수사대 판단 미션';box.append(title);const p=document.createElement('p');p.textContent=q.q;box.append(p);const buttons=q.options.map((label,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+label;box.append(b);return b});const result=document.createElement('div');result.setAttribute('aria-live','polite');box.append(result);buttons.forEach((b,i)=>b.addEventListener('click',()=>{const good=i===q.correct;buttons.forEach(x=>x.disabled=true);b.classList.add(good?'yj-correct':'yj-wrong');result.className='yj-feedback'+(good?' good':'');result.innerHTML=(good?'<span class="yj-stamp">★ 참 잘했어요!</span>':'')+'<strong>'+(good?'올바른 판단입니다':'다시 생각해 보세요')+'</strong><p>'+(good?q.good:q.bad)+'</p>';}));const anchor=key==='sms'?g.querySelector('.s2-sms'):g.querySelector('button.primary');if(anchor){key==='sms'?anchor.after(box):anchor.before(box)}else{g.append(box)}}
let pending=false;new MutationObserver(()=>{if(pending)return;pending=true;queueMicrotask(()=>{pending=false;mountQuiz()})}).observe(document.body,{childList:true,subtree:true});mountQuiz();
})();</script></body></html>
